default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
        exclude: ^tsconfig\.json$
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: pnpm lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: check
        name: typecheck
        entry: pnpm check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: test
        name: test
        entry: pnpm test
        language: system
        pass_filenames: false
        stages: [pre-commit]
